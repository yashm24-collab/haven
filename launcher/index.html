<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <title>Haven</title>
  <link rel="stylesheet" href="style.css">
  <link rel="stylesheet" href="renewal-panel.css">
</head>
<body class="view-home">
  <!-- The living scene: two videos so a time-of-day change can crossfade; the still shows while paused. -->
  <div id="scene" aria-hidden="true">
    <img id="sceneStill" alt="">
    <video id="sceneA" muted loop playsinline preload="auto"></video>
    <video id="sceneB" muted loop playsinline preload="auto"></video>
    <img id="sheetBg" alt="">
    <div id="dim"></div>
  </div>
  <div id="wash" aria-hidden="true"></div>

  <main id="home">
    <header id="top">
      <div id="orb" class="focusable" role="button" aria-label="World clock">
        <div id="marble"></div>
        <canvas id="orbRive" width="384" height="384" aria-hidden="true"></canvas>
      </div>
      <div id="time"><div id="clock"></div><div id="date"></div></div>
      <div id="topRight">
        <div id="btnResume" class="chip focusable hidden" role="button">Turn Home control back on</div>
        <div id="gear" class="chip round focusable" role="button" aria-label="Settings">
          <svg viewBox="0 0 24 24" aria-hidden="true"><circle cx="12" cy="12" r="3.2"/><path d="M12 2.8v2.4M12 18.8v2.4M2.8 12h2.4M18.8 12h2.4M5.5 5.5l1.7 1.7M16.8 16.8l1.7 1.7M5.5 18.5l1.7-1.7M16.8 7.2l1.7-1.7"/></svg>
        </div>
      </div>
    </header>
    <div id="label" aria-live="polite"></div>
    <div id="tiles" role="list"></div>
  </main>

  <!-- World Clock: the backdrop (scene + baked liquid glass sheet + iso-glow globe) is one video. -->
  <section id="clockView" class="view" aria-label="World clock">
    <img id="wcPoster" alt="">
    <video id="wcVideo" muted loop playsinline preload="none"></video>
    <div id="cityDot" aria-hidden="true"></div>
    <div id="wcSheet" class="sheetText">
      <h2>World clock</h2>
      <div id="cityList" role="list"></div>
    </div>
  </section>

  <section id="appsView" class="view" aria-label="All apps">
    <h2 class="viewTitle">All apps</h2>
    <div id="appsPort"><div id="appsGrid"></div></div>
  </section>

  <section id="settingsView" class="view" aria-label="Settings">
    <div id="setSheet" class="sheetText">
      <h2>Settings</h2>
      <div id="setList" role="list"></div>
    </div>
  </section>

  <div id="lens" aria-hidden="true"></div>
  <!-- "Welcome home": plays once after power-on (cold start), any key skips it. -->
  <div id="intro" aria-hidden="true"><video id="introVideo" muted playsinline preload="auto"></video></div>
  <div id="curtain"><span></span></div>
  <div id="toast" role="status"></div>

  <script>
    // helper-control.js may report before app.js loads (profile-bootstrap loads it later): remember the state.
    window.setHelperResumeVisible = function (v) { window.lumenHelperStopped = v; };
    window.helperResumeMessage = function () {};
  </script>
  <script src="config.js"></script>
  <script src="marks.js"></script>
  <script src="apps.js"></script>
  <script src="user-data.js"></script>
  <script src="renewal-panel.js"></script>
  <script src="assets/rive.js"></script>
  <script src="lumen-math.js"></script>
  <script src="profile-bootstrap.js"></script>
  <script src="native-bootstrap.js"></script>
  <script src="helper-control.js"></script>
</body>
</html>
